$wall = $XDG_CONFIG_HOME/wallpapers/hyprlock-light.jpg
# $wall = $XDG_CONFIG_HOME/wallpapers/hyprlock-light.png
# $avatar = $XDG_CONFIG_HOME/wallpapers/avatar.jpg
$avatar = $XDG_CONFIG_HOME/wallpapers/avatar.png
source = $XDG_CONFIG_HOME/colors/colors.conf

# BACKGROUND
background {
    monitor =
    path = $wall
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8916
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = $peach
    font_family = JetBrainsMono NF Regular
    font_size = 32
    position = 0, -40
    halign = center
    valign = center
}

# DAY-MONTH-DATE
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %d %B")"
    color = $peach
    font_size = 24
    font_family = JetBrainsMono NF Regular
    position = 0, -110
    halign = center
    valign = center
}

# MAIN-BOX
shape {
    monitor =
    size = 560, 560
    color = rgba(30, 32, 48, 0.82)
    rounding = 30
    rotate = 0
    xray = false 
    position = 0, -70
    halign = center
    valign = center
}

# PROFILE-PHOTO BACKGROUND
shape {
    monitor =
    size = 160, 160
    color = $crust
    rounding = -1
    rotate = 0
    xray = false
    position = 0, 100
    halign = center
    valign = center
}

# PROFILE PHOTO
image {
    monitor =
    path = $avatar
    border_size = 1
    border_color = $blue
    size = 160
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 100
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 320, 55
    color = rgba(255, 255, 255, 0.1)
    rounding = -1
    border_size = 0
    rotate = 0
    xray = false
    position = 0, -210
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = $subtext0
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 16
    position = 0, -210
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 16


    inner_color = rgba(255, 255, 255, 0.1)
    font_color = $subtext0
    check_color = rgba(0, 255, 0, 0.6)
    fail_color = rgba(255, 0, 0, 0.6)
  
    capslock_color = $flamingo
    numlock_color = $yellow

   fade_on_empty = false
    placeholder_text = <span foreground="##a5adcb">     Password</span>
    hide_input = false
    position = 0, -288
    halign = center
    valign = center
}
